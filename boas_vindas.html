<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 60px 40px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #f8fafc;
            font-size: 2.5em;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .emoji {
            font-size: 4em;
            margin-bottom: 20px;
        }

        p {
            color: #cbd5e1;
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            background: #3b82f6;
            color: #ffffff;
            padding: 16px 48px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1em;
            transition: all 0.2s ease;
            border: 2px solid #3b82f6;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .button:hover {
            background: #2563eb;
            border-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .button:focus {
            outline: 3px solid #60a5fa;
            outline-offset: 2px;
        }

        .features {
            display: flex;
            justify-content: space-around;
            margin-top: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .feature {
            flex: 1;
            min-width: 120px;
            padding: 24px;
            background: #334155;
            border: 1px solid #475569;
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .feature:hover {
            transform: translateY(-4px);
            border-color: #64748b;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .feature-icon {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .feature h3 {
            color: #f1f5f9;
            font-size: 1em;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .feature p {
            font-size: 0.9em;
            margin-bottom: 0;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bem-vindo!</h1>
        <p>Estamos muito felizes em recebê-lo aqui. Prepare-se para uma experiência incrível!</p>
        
        <button class="button" onclick="alert('Obrigado por visitar!')" aria-label="Iniciar experiência">Começar</button>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">🚀</div>
                <h3>Rápido</h3>
                <p>Performance otimizada</p>
            </div>
            <div class="feature">
                <div class="feature-icon">🎨</div>
                <h3>Moderno</h3>
                <p>Design atualizado</p>
            </div>
            <div class="feature">
                <div class="feature-icon">💡</div>
                <h3>Intuitivo</h3>
                <p>Fácil de usar</p>
            </div>
        </div>
    </div>
</body>
</html>
